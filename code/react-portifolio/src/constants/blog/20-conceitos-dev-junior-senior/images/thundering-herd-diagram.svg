<svg viewBox="0 0 1150 480" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <defs>
    <marker id="arrowB2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
    <marker id="arrowR2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1150" height="480" fill="#ffffff"/>

  <rect x="30" y="20" width="600" height="170" rx="18" fill="#ded1fb" stroke="#1a1a1a" stroke-width="3"/>
  <text x="330" y="95" text-anchor="middle" font-size="24" font-weight="bold" fill="#1a1a1a">Milhares de clientes</text>
  <text x="330" y="125" text-anchor="middle" font-size="15" fill="#444444">lendo o mesmo post</text>

  <rect x="900" y="20" width="220" height="170" rx="18" fill="#cdf3d8" stroke="#1a1a1a" stroke-width="3"/>
  <text x="1010" y="95" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">Cache</text>
  <text x="1010" y="122" text-anchor="middle" font-size="13" fill="#245c34">respondia tudo —</text>
  <text x="1010" y="140" text-anchor="middle" font-size="13" fill="#245c34">até agora</text>

  <line x1="630" y1="105" x2="896" y2="105" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrowB2)"/>

  <rect x="920" y="210" width="180" height="55" rx="27" fill="#ffffff" stroke="#e67e22" stroke-width="2.5"/>
  <text x="1010" y="245" text-anchor="middle" font-size="16" font-weight="bold" fill="#e67e22">cache expira</text>

  <rect x="30" y="310" width="600" height="150" rx="18" fill="#ffffff" stroke="#888888" stroke-width="2.5"/>
  <text x="330" y="378" text-anchor="middle" font-size="18" fill="#555555">todas de novo,</text>
  <text x="330" y="404" text-anchor="middle" font-size="18" fill="#555555">ao mesmo tempo</text>

  <rect x="900" y="290" width="220" height="170" rx="18" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
  <text x="1010" y="365" text-anchor="middle" font-size="21" font-weight="bold" fill="#1a1a1a">Banco de dados</text>
  <text x="1010" y="392" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">recebe tudo</text>
  <text x="1010" y="411" text-anchor="middle" font-size="14" font-weight="bold" fill="#c0392b">de uma vez</text>

  <line x1="630" y1="385" x2="896" y2="385" stroke="#c0392b" stroke-width="3" marker-end="url(#arrowR2)"/>
</svg>
