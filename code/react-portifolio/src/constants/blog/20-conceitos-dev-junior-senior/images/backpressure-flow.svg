  <rect x="710" y="30" width="260" height="160" rx="18" fill="#cdf3d8" stroke="#1a1a1a" stroke-width="3"/>
  <text x="840" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Processador</text>
  <text x="840" y="130" text-anchor="middle" font-size="15" fill="#444444">processa 5 msg/s</text>

  <line x1="290" y1="110" x2="366" y2="110" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrowB1)"/>
  <line x1="630" y1="110" x2="706" y2="110" stroke="#1a1a1a" stroke-width="2.5" marker-end="url(#arrowB1)"/>
