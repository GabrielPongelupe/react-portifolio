      <path d="M0,0 L10,5 L0,10 z" fill="#1a1a1a"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1000" height="220" fill="#ffffff"/>

  <rect x="30" y="30" width="260" height="160" rx="18" fill="#ded1fb" stroke="#1a1a1a" stroke-width="3"/>
  <text x="160" y="100" text-anchor="middle" font-size="22" font-weight="bold" fill="#1a1a1a">Webscraper</text>
  <text x="160" y="130" text-anchor="middle" font-size="15" fill="#444444">produz 20 msg/s</text>

  <rect x="370" y="30" width="260" height="160" rx="18" fill="#fdecea" stroke="#c0392b" stroke-width="3"/>
