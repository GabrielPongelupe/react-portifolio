<svg viewBox="0 0 900 768" xmlns="http://www.w3.org/2000/svg" font-family="Verdana, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="768" fill="#ffffff"/>

  <!-- ROW 1: At most once -->
  <rect x="20" y="20" width="860" height="170" rx="18" fill="#e9ecef" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="300" y1="35" x2="300" y2="175" stroke="#bbbbbb" stroke-width="1.5"/>
  <line x1="590" y1="35" x2="590" y2="175" stroke="#bbbbbb" stroke-width="1.5"/>

  <text x="45" y="75" font-size="24" font-weight="bold" fill="#1a1a1a">At most once</text>
  <text x="45" y="110" font-size="14" font-style="italic" fill="#777777">simples, mas arriscado</text>

  <text x="445" y="75" text-anchor="middle" font-size="15" fill="#555555">Pode perder mensagens?</text>
  <text x="445" y="132" text-anchor="middle" font-size="32" font-weight="bold" fill="#c0392b">Sim</text>

  <text x="735" y="75" text-anchor="middle" font-size="15" fill="#555555">Pode duplicar mensagens?</text>
  <text x="735" y="132" text-anchor="middle" font-size="32" font-weight="bold" fill="#1a7a3c">Não</text>

  <!-- ROW 2: At least once -->
  <rect x="20" y="206" width="860" height="170" rx="18" fill="#e9ecef" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="300" y1="221" x2="300" y2="361" stroke="#bbbbbb" stroke-width="1.5"/>
  <line x1="590" y1="221" x2="590" y2="361" stroke="#bbbbbb" stroke-width="1.5"/>

  <text x="45" y="261" font-size="24" font-weight="bold" fill="#1a1a1a">At least once</text>
  <text x="45" y="296" font-size="14" font-style="italic" fill="#777777">o mais comum na prática</text>

  <text x="445" y="261" text-anchor="middle" font-size="15" fill="#555555">Pode perder mensagens?</text>
  <text x="445" y="318" text-anchor="middle" font-size="32" font-weight="bold" fill="#1a7a3c">Não</text>

  <text x="735" y="261" text-anchor="middle" font-size="15" fill="#555555">Pode duplicar mensagens?</text>
  <text x="735" y="318" text-anchor="middle" font-size="32" font-weight="bold" fill="#c0392b">Sim</text>

  <!-- ROW 3: Exactly once -->
  <rect x="20" y="392" width="860" height="170" rx="18" fill="#e9ecef" stroke="#1a1a1a" stroke-width="3"/>
  <line x1="300" y1="407" x2="300" y2="547" stroke="#bbbbbb" stroke-width="1.5"/>
  <line x1="590" y1="407" x2="590" y2="547" stroke="#bbbbbb" stroke-width="1.5"/>

  <text x="45" y="447" font-size="24" font-weight="bold" fill="#1a1a1a">Exactly once</text>
  <text x="45" y="482" font-size="14" font-style="italic" fill="#777777">forte, mas caro e complexo</text>

  <text x="445" y="447" text-anchor="middle" font-size="15" fill="#555555">Pode perder mensagens?</text>
  <text x="445" y="504" text-anchor="middle" font-size="32" font-weight="bold" fill="#1a7a3c">Não</text>

  <text x="735" y="447" text-anchor="middle" font-size="15" fill="#555555">Pode duplicar mensagens?</text>
  <text x="735" y="504" text-anchor="middle" font-size="32" font-weight="bold" fill="#1a7a3c">Não</text>

  <!-- ROW 4: At least once + idempotente (destaque) -->
  <rect x="20" y="578" width="860" height="170" rx="18" fill="#eafaf0" stroke="#1a7a3c" stroke-width="3.5"/>
  <line x1="300" y1="593" x2="300" y2="733" stroke="#bbbbbb" stroke-width="1.5"/>
  <line x1="590" y1="593" x2="590" y2="733" stroke="#bbbbbb" stroke-width="1.5"/>

  <text x="45" y="623" font-size="22" font-weight="bold" fill="#1a1a1a">At least once</text>
  <text x="45" y="645" font-size="14" font-weight="bold" fill="#1a7a3c">+ consumidor idempotente</text>
  <text x="45" y="670" font-size="13" font-weight="bold" fill="#245c34">o padrão mais usado no mercado</text>

  <text x="445" y="633" text-anchor="middle" font-size="15" fill="#555555">Pode perder mensagens?</text>
  <text x="445" y="690" text-anchor="middle" font-size="32" font-weight="bold" fill="#1a7a3c">Não</text>

  <text x="735" y="633" text-anchor="middle" font-size="15" fill="#555555">Duplicata é um problema?</text>
  <text x="735" y="690" text-anchor="middle" font-size="32" font-weight="bold" fill="#1a7a3c">Não</text>
</svg>
